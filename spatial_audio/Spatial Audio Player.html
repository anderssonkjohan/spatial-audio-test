<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spatial Audio Player</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--fg:#14161c;--mut:#6b7080;--acc:#5b5bf0;--ln:#dcdfe8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1016;--card:#181b24;--fg:#eceef5;--mut:#8b90a3;--acc:#8b8bff;--ln:#2a2e3b}}
:root[data-theme="dark"]{--bg:#0e1016;--card:#181b24;--fg:#eceef5;--mut:#8b90a3;--acc:#8b8bff;--ln:#2a2e3b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
p.s{color:var(--mut);margin:0 0 14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
canvas{width:100%;aspect-ratio:1;display:block;touch-action:none;border-radius:12px;cursor:grab}
button,.btn{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:10px;padding:9px 14px;cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);flex:1;min-width:130px}
input[type=range]{width:100%;accent-color:var(--acc)}
.t{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
#name{font-weight:600;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{flex-direction:row;align-items:center;color:var(--fg);font-size:14px;min-width:auto;gap:6px}
</style></head><body><main>
<h1>🎧 Spatial Audio Player</h1>
<p class="s">Works with any stereo headphones. Drag the sound around your head — it uses binaural HRTF rendering.</p>

<div class="card"><canvas id="c" width="440" height="440"></canvas>
<div class="t" style="margin-top:8px"><span id="pos">Front</span><span id="dist"></span></div></div>

<div class="card">
<div id="name">11325622-trance-arp-loop-128bpm-240905.mp3</div>
<input type="range" id="seek" min="0" max="1000" value="0">
<div class="t"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<div class="row" style="margin-top:10px">
<button class="p" id="play">▶ Play</button>
<label class="btn" style="flex:0;min-width:auto;color:var(--fg);font-size:14px;cursor:pointer">Open audio file<input id="file" type="file" accept="audio/*" hidden></label>
<label class="chk"><input type="checkbox" id="loop" checked>Loop</label>
</div></div>

<div class="card">
<div class="row">
<label>Distance <input type="range" id="d" min="0.5" max="6" step="0.1" value="2"></label>
<label>Height <input type="range" id="h" min="-3" max="3" step="0.1" value="0"></label>
</div>
<div class="row" style="margin-top:10px">
<label>Room reverb <input type="range" id="rv" min="0" max="100" value="25"></label>
<label>Volume <input type="range" id="vol" min="0" max="100" value="80"></label>
</div>
<div class="row" style="margin-top:12px">
<label class="chk"><input type="checkbox" id="orb">Auto-orbit</label>
<label style="min-width:120px">Orbit speed <input type="range" id="os" min="5" max="120" value="30"></label>
</div></div>
<div class="card">
<div class="row">
<label>Head tracking
<select id="ht" style="font:inherit;padding:8px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--fg)">
<option value="off">Off</option><option value="cam">Webcam (face tracking)</option><option value="sensor">Device motion sensor</option></select></label>
<button id="rc" style="flex:0">Recenter</button>
</div>
<div class="t" style="margin-top:8px"><span id="hs">Turn your head and the sound stays put in the room.</span><span id="hy"></span></div>
</div>
</main>

function makeDemo(c){
  const sr=c.sampleRate,len=sr*8,b=c.createBuffer(1,len,sr),d=b.getChannelData(0);
  const notes=[220,261.6,329.6,392,329.6,261.6,440,392],beat=sr*0.25;
  for(let i=0;i<32;i++){const f=notes[i%8]*(i>=16?1.335:1),s=Math.floor(i*beat);
    for(let n=0;n<beat*1.6&&s+n<len;n++){const t=n/sr,e=Math.exp(-t*6);
      d[s+n]+=0.28*e*(Math.sin(6.283*f*t)+0.4*Math.sin(12.566*f*t)+0.2*Math.sin(18.85*f*t));}}
  for(let i=0;i<32;i++){const s=Math.floor(i*beat+(i%2?beat/2:0)*0);
    if(i%2===0){for(let n=0;n<sr*0.18&&s+n<len;n++){const t=n/sr;d[s+n]+=0.5*Math.exp(-t*25)*Math.sin(6.283*(50+90*Math.exp(-t*30))*t);}}
    else{for(let n=0;n<sr*0.06&&s+n<len;n++)d[s+n]+=0.18*Math.exp(-n/sr*60)*(Math.random()*2-1);}}
  return b;
}
function makeIR(c,sec=2.2){const n=c.sampleRate*sec,b=c.createBuffer(2,n,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}return b;}

function init(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  panner=ctx.createPanner();
  panner.panningModel='HRTF';panner.distanceModel='inverse';panner.refDistance=1;panner.rolloffFactor=1;panner.maxDistance=20;
  dry=ctx.createGain();wet=ctx.createGain();master=ctx.createGain();conv=ctx.createConvolver();
  conv.buffer=makeIR(ctx);
  panner.connect(dry);panner.connect(conv);conv.connect(wet);dry.connect(master);wet.connect(master);master.connect(ctx.destination);
  const L=ctx.listener;
  if(L.positionX){L.positionX.value=0;L.positionY.value=0;L.positionZ.value=0;L.forwardX.value=0;L.forwardY.value=0;L.forwardZ.value=-1;L.upX.value=0;L.upY.value=1;L.upZ.value=0;}
  else{L.setPosition(0,0,0);L.setOrientation(0,0,-1,0,1,0);}
  ready=loadDefault();
  applyAll();
}

async function loadDefault(){
  try{
    const bin=atob(AUDIO_B64),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    buf=await ctx.decodeAudioData(u.buffer);
  }catch(err){
    buf=makeDemo(ctx);
    $('name').textContent='Could not decode the embedded track — playing built-in demo. Use "Open audio file" to pick one.';
  }
}
function applyPos(){
  if(!panner)return;const y=+$('h').value;
  if(panner.positionX){panner.positionX.value=px;panner.positionY.value=y;panner.positionZ.value=pz;}
  else panner.setPosition(px,y,pz);
  const dist=Math.hypot(px,pz);
  $('dist').textContent=dist.toFixed(1)+' m';
  let a=Math.atan2(px,-pz)*180/Math.PI-(typeof yawSm==='number'?yawSm*180/Math.PI:0);a=((a+540)%360)-180;const m=Math.abs(a);
  $('pos').textContent=(m<25?'Front':m>155?'Behind':a>0?'Right':'Left')+(m>=25&&m<=155?(m<65?' front':m>115?' back':''):'')+' · '+Math.round(a)+'°';
}
function applyAll(){
  const wv=+$('rv').value/100;wet.gain.value=wv*1.2;dry.gain.value=1-wv*0.3;
  master.gain.value=Math.pow(+$('vol').value/100,2);applyPos();
}
function setDist(){const r=+$('d').value,a=Math.atan2(px,-pz);px=r*Math.sin(a);pz=-r*Math.cos(a);applyPos();}

function pos(){return playing?(ctx.currentTime-startedAt)%buf.duration:offset;}
async function play(){
  init();await ready;if(ctx.state==='suspended')ctx.resume();
  src=ctx.createBufferSource();src.buffer=buf;src.loop=$('loop').checked;src.connect(panner);
  const me=src;src.onended=()=>{if(me===src&&playing&&!me.loop){playing=false;offset=0;ui();}};
  src.start(0,offset);startedAt=ctx.currentTime-offset;playing=true;ui();
}
function pause(){if(!playing)return;offset=pos();const s=src;src=null;s.onended=null;s.stop();playing=false;ui();}
function ui(){$('play').textContent=playing?'⏸ Pause':'▶ Play';}
$('play').onclick=()=>playing?pause():play();
$('loop').onchange=()=>{if(src)src.loop=$('loop').checked;};
$('seek').oninput=async()=>{init();await ready;offset=$('seek').value/1000*buf.duration;if(playing){const s=src;src=null;s.onended=null;s.stop();playing=false;play();}};
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;init();await ready;
  try{
    const wasPlaying=playing;if(playing)pause();
    $('name').textContent='Decoding…';
    buf=await ctx.decodeAudioData(await f.arrayBuffer());
    offset=0;$('name').textContent=f.name;if(wasPlaying||true)play();
  }catch(err){$('name').textContent='Could not decode that file';}
};
['d','h','rv','vol'].forEach(i=>$(i).oninput=()=>{init();i==='d'?setDist():applyAll();});
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');

function toWorld(e){const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*S,y=(e.clientY-r.top)/r.height*S;
  let wx=(x-S/2)/SC,wz=(y-S/2)/SC;const m=Math.hypot(wx,wz);
  if(m<0.5){wx*=0.5/(m||1);wz*=0.5/(m||1);}if(m>6){wx*=6/m;wz*=6/m;}
  px=wx;pz=wz;$('d').value=Math.hypot(px,pz);
}
cv.onpointerdown=e=>{init();drag=true;$('orb').checked=false;cv.setPointerCapture(e.pointerId);toWorld(e);applyPos();};
cv.onpointermove=e=>{if(drag){toWorld(e);applyPos();}};
cv.onpointerup=()=>drag=false;

/* ---------- head tracking ---------- */
let mode='off',yawRaw=0,yawOff=0,yawSm=0,landmarker,camStream,lastVT=-1,vid=document.createElement('video');
vid.muted=true;vid.playsInline=true;
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a)),hs=t=>$('hs').textContent=t;
function setOrient(y){
  if(!ctx)return;const L=ctx.listener,fx=Math.sin(y),fz=-Math.cos(y);
  if(L.forwardX){L.forwardX.value=fx;L.forwardZ.value=fz;}else L.setOrientation(fx,0,fz,0,1,0);
}
function onMotion(e){if(e.alpha!=null)yawRaw=-e.alpha*Math.PI/180;}
function stopTracking(){
  mode='off';window.removeEventListener('deviceorientation',onMotion);window.removeEventListener('deviceorientationabsolute',onMotion);
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
  yawRaw=yawOff=0;
}
$('rc').onclick=()=>{yawOff=yawRaw;};
$('ht').onchange=async e=>{
  const m=e.target.value;stopTracking();init();
  if(m==='off'){hs('Head tracking off.');return;}
  try{
    if(m==='sensor'){
      if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){
        if(await DeviceOrientationEvent.requestPermission()!=='granted')throw new Error('Permission denied');}
      window.addEventListener('deviceorientation',onMotion);
      mode='sensor';hs('Using motion sensor — hold or mount the device on your head, then Recenter.');
    }else{
      hs('Loading face tracker (needs internet once)…');
      if(!landmarker){
        const B='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
        const V=await import(B+'/vision_bundle.mjs');
        const fs=await V.FilesetResolver.forVisionTasks(B+'/wasm');
        const opts=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:d},runningMode:'VIDEO',numFaces:1});
        try{landmarker=await V.FaceLandmarker.createFromOptions(fs,opts('GPU'));}
        catch(_){landmarker=await V.FaceLandmarker.createFromOptions(fs,opts('CPU'));}
      }
      camStream=await navigator.mediaDevices.getUserMedia({video:{width:320,height:240,facingMode:'user'}});
      vid.srcObject=camStream;await vid.play();
      mode='cam';hs('Tracking your face — video stays on this device. Look ahead, then Recenter.');
    }
  }catch(err){stopTracking();$('ht').value='off';hs('Could not start: '+(err.message||err));}
};
function trackStep(){
  if(mode==='cam'&&landmarker&&vid.readyState>=2&&vid.currentTime!==lastVT){
    lastVT=vid.currentTime;
    const f=landmarker.detectForVideo(vid,performance.now()).faceLandmarks[0];
    if(f){const n=f[1],a=f[33],b=f[263],w=Math.abs(a.x-b.x)||1,dx=n.x-(a.x+b.x)/2;
      yawRaw=Math.asin(Math.max(-1,Math.min(1,-dx/(0.4*w))));}
  }
  const target=mode==='off'?0:wrap(yawRaw-yawOff);
  yawSm+=wrap(target-yawSm)*0.3;
  setOrient(yawSm);
  if(mode!=='off'){$('hy').textContent=Math.round(yawSm*180/Math.PI)+'°';}else $('hy').textContent='';
}

let last=performance.now();
function draw(now){
  const dt=(now-last)/1000;last=now;trackStep();if(mode!=='off')applyPos();
  if($('orb').checked&&!drag){const r=Math.hypot(px,pz)||2;ang=Math.atan2(px,-pz)+dt*(+$('os').value)*Math.PI/180;
    px=r*Math.sin(ang);pz=-r*Math.cos(ang);applyPos();}
  const cs=getComputedStyle(document.documentElement),fg=cs.getPropertyValue('--fg'),mut=cs.getPropertyValue('--mut'),acc=cs.getPropertyValue('--acc'),ln=cs.getPropertyValue('--ln');
  g.clearRect(0,0,S,S);g.fillStyle=cs.getPropertyValue('--bg');g.fillRect(0,0,S,S);
  g.strokeStyle=ln;g.lineWidth=1;
  for(let r=1;r<=6;r++){g.beginPath();g.arc(S/2,S/2,r*SC,0,7);g.stroke();}
  g.beginPath();g.moveTo(S/2,0);g.lineTo(S/2,S);g.moveTo(0,S/2);g.lineTo(S,S/2);g.stroke();
  g.fillStyle=mut;g.font='13px system-ui';g.textAlign='center';
  g.fillText('FRONT',S/2,16);g.fillText('BACK',S/2,S-8);g.fillText('L',12,S/2-6);g.fillText('R',S-12,S/2-6);
  g.save();g.translate(S/2,S/2);g.rotate(yawSm);g.fillStyle=fg;g.beginPath();g.arc(0,0,15,0,7);g.fill();
  g.beginPath();g.moveTo(0,-26);g.lineTo(-8,-12);g.lineTo(8,-12);g.fill();g.restore();
  const sx=S/2+px*SC,sy=S/2+pz*SC,pl=playing?1+0.25*Math.sin(now/120):1;
  g.fillStyle=acc;g.globalAlpha=0.2;g.beginPath();g.arc(sx,sy,28*pl,0,7);g.fill();
  g.globalAlpha=1;g.beginPath();g.arc(sx,sy,13,0,7);g.fill();
  if(buf){const p=pos();$('cur').textContent=fmt(p);$('dur').textContent=fmt(buf.duration);if(playing&&document.activeElement!==$('seek'))$('seek').value=p/buf.duration*1000;}
  requestAnimationFrame(draw);
}
applyPos();$('pos').textContent='Front · 0°';$('dist').textContent='2.0 m';
requestAnimationFrame(draw);
</script></body></html>
